name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{f = (index($0, "## " v " ") == 1); next} f' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "ScaleAPIMonitor $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
